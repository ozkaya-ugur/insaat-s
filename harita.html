<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coğrafi İzlerimiz | BUYAPI İnşaat</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@200;300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/michele-m/soria-font@master/soria.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="fluid-mesh-bg">
        <div class="mesh-orb mesh-1"></div>
        <div class="mesh-orb mesh-2"></div>
        <div class="mesh-orb mesh-3"></div>
    </div>

    <!-- Ortak Header Yükleme Alanı -->
    <div id="site-header"></div>

    <section class="page-banner">
        <div class="container">
            <span class="section-tag">LOKASYONLARIMIZ</span>
            <h1 class="page-title">İnteraktif Türkiye Haritası</h1>
        </div>
    </section>

    <section class="interactive-map-section section-padding" style="border: none; background: transparent;">
        <div class="container">
            <div class="map-wrapper">
                <div class="map-image-container">
                    <img src="images/harita.svg.webp" alt="Türkiye Haritası" class="turkey-map-img">

                    <div class="map-pin pin-sakarya active" data-city="sakarya" style="top: 26%; left: 30%;">
                        <div class="pulse-ring"></div>
                        <div class="pin-badge"><span class="pin-count">28</span></div>
                        <span class="pin-tooltip">SAKARYA</span>
                    </div>

                    <div class="map-pin pin-istanbul" data-city="istanbul" style="top: 22%; left: 21%;">
                        <div class="pulse-ring"></div>
                        <div class="pin-badge"><span class="pin-count">4</span></div>
                        <span class="pin-tooltip">İSTANBUL</span>
                    </div>

                    <div class="map-pin pin-ankara" data-city="ankara" style="top: 40%; left: 42%;">
                        <div class="pulse-ring"></div>
                        <div class="pin-badge"><span class="pin-count">1</span></div>
                        <span class="pin-tooltip">ANKARA</span>
                    </div>

                    <div class="map-pin pin-giresun" data-city="giresun" style="top: 26%; left: 71%;">
                        <div class="pulse-ring"></div>
                        <div class="pin-badge"><span class="pin-count">1</span></div>
                        <span class="pin-tooltip">GİRESUN</span>
                    </div>
                </div>

                <div class="map-projects-panel" id="mapProjectsPanel">
                    <div class="panel-header">
                        <span class="panel-tag" id="panelCityTag">LOKASYON: SAKARYA</span>
                        <h3 id="panelCityTitle">Sakarya Projelerimiz</h3>
                    </div>
                    <div class="panel-project-cards" id="panelCardsContainer"></div>
                    
                    <div class="panel-footer-action">
                        <a href="projeler.html" class="all-projects-btn">
                            <span>TÜM PROJELERİ GÖRÜNTÜLE</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Ortak Footer Yükleme Alanı -->
    <div id="site-footer"></div>
<!-- Ortak Bileşen Scriptleri -->
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    
    <!-- Animasyon & Proje Scriptleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
